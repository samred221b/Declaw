# ================================
# TaskFlow - Application Properties
# ================================

# Spring Boot Application Settings
spring.application.name=Task Flow
server.port=8081

# ================================
# Database Configuration (PostgreSQL)
# ================================
spring.datasource.url=jdbc:postgresql://localhost:5432/taskflow
spring.datasource.username=taskflow_user
spring.datasource.password=taskflow_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop  # create-drop for development; use 'validate' or 'update' in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ================================
# JWT Configuration
# ================================
spring.security.jwt.secret=${JWT_SECRET:TaskFlowSecretKeyForAuthenticationAndAuthorization2024}
spring.security.jwt.expiration=3600000  # 1 hour in milliseconds
spring.security.jwt.refresh-token-validity=86400000  # 24 hours

# ================================
# Swagger/OpenAPI Configuration
# ================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-operationId=true
springdoc.swagger-ui.filter=true

# ================================
# Logging Configuration
# ================================
spring.format.ansi.enabled=ALWAYS
logging.level.org.springframework.security=DEBUG
logging.level.com.taskflow=DEBUG
